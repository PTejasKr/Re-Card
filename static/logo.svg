<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" width="100%" height="100%">
  <defs>
    <!-- Card 1 (Back Dark Card) Gradient -->
    <linearGradient id="backCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2118"/>
      <stop offset="40%" stop-color="#361814"/>
      <stop offset="100%" stop-color="#140a09"/>
    </linearGradient>

    <!-- Card 2 (Front Frosted Glass Card) Gradient -->
    <linearGradient id="frontCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#803328" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#4d1616" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#0e1311" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Cards -->
  <circle cx="108" cy="62" r="32" fill="#5c261e" opacity="0.14" filter="url(#softGlow)"/>

  <!-- Back Angular Card (Dark Burgundy / Chocolate) -->
  <g transform="translate(82, 70) rotate(14) translate(-42, -58)" filter="url(#dropShadow)">
    <!-- Base Card -->
    <rect x="0" y="0" width="84" height="116" rx="9" fill="url(#backCardGrad)" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
    <!-- Magnetic Stripe -->
    <rect x="0" y="18" width="84" height="18" fill="#1f0f0c" opacity="0.9"/>
    <!-- Chip / Hologram Accent -->
    <rect x="48" y="48" width="22" height="14" rx="3" fill="#c59b27" opacity="0.82" stroke="#8c6a15" stroke-width="0.7"/>
    <!-- Micro Card Lines -->
    <line x1="12" y1="92" x2="42" y2="92" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="98" x2="30" y2="98" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Front Frosted Card (Translucent Rose-Glass Overlap) -->
  <g transform="translate(62, 74) rotate(-15) translate(-44, -58)" filter="url(#dropShadow)">
    <!-- Glass Surface -->
    <rect x="0" y="0" width="84" height="116" rx="9" fill="url(#frontCardGrad)" stroke="rgba(255,255,255,0.7)" stroke-width="1.4"/>
    
    <!-- EMV Smart Chip -->
    <g transform="translate(14, 76)">
      <rect x="0" y="0" width="18" height="14" rx="2.5" fill="#e6b349" stroke="#b08020" stroke-width="0.8"/>
      <path d="M 0,5 H 18 M 0,9 H 18 M 9,0 V 14" stroke="#94640d" stroke-width="0.7"/>
    </g>

    <!-- Embossed Card Digits / Accent lines -->
    <g opacity="0.45" stroke="#ffffff" stroke-linecap="round">
      <line x1="14" y1="20" x2="14" y2="34" stroke-width="1"/>
      <line x1="20" y1="20" x2="20" y2="34" stroke-width="1"/>
      <line x1="26" y1="20" x2="26" y2="34" stroke-width="1"/>
      <line x1="32" y1="20" x2="32" y2="34" stroke-width="1"/>
    </g>

    <!-- Cardholder Dots -->
    <circle cx="64" cy="83" r="5" fill="#e0a370" opacity="0.85"/>
    <circle cx="56" cy="83" r="5" fill="#d44b4b" opacity="0.8"/>
  </g>
</svg>
